baseURL = "https://hatchetlabs.com/"
languageCode = "en-us"
title = "Hatchet Labs"
enableRobotsTXT = true

[params]
  description = "Projects and experiments from Hatchet Labs."
  tagline = "What we're building."

[taxonomies]
  tag = "tags"

[outputs]
  home = ["html", "rss"]
  section = ["html", "rss"]

[menus]
  [[menus.main]]
    name = "Projects"
    pageRef = "/projects"
    weight = 10
  [[menus.main]]
    name = "About"
    pageRef = "/about"
    weight = 20
  [[menus.main]]
    name = "Contact"
    pageRef = "/contact"
    weight = 30

[markup.goldmark.renderer]
  unsafe = false
