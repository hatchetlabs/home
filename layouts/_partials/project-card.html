<article class="card status-{{ .Params.status | default "live" }}">
  <header>
    <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
    {{ partial "status.html" . }}
  </header>
  <p>{{ .Params.summary | default .Summary | plainify }}</p>
  <footer>
    {{ with .Params.link }}<a class="visit" href="{{ . }}">{{ strings.TrimPrefix "https://" . }} ↗</a>{{ end }}
    {{ with .Params.tags }}<span class="tags">{{ delimit . " · " }}</span>{{ end }}
  </footer>
</article>
