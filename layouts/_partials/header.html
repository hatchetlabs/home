<header class="site-header">
  <div class="wrap">
    <a class="brand" href="{{ site.Home.RelPermalink }}"><img class="logo" src="{{ "logo.png" | relURL }}" width="32" height="31" alt="">{{ site.Title }}</a>
    <nav>
      {{ range site.Menus.main }}
        <a href="{{ .URL }}"{{ if or ($.IsMenuCurrent "main" .) ($.HasMenuCurrent "main" .) }} aria-current="page"{{ end }}>{{ .Name }}</a>
      {{ end }}
    </nav>
  </div>
</header>
